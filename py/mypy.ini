[mypy]
python_version = 3.13

# google-cloud-bigtable is only imported lazily by the bigtable_sharding
# row-key sampler and is not installed in the type-check env, so let mypy treat
# it as untyped rather than failing to resolve the import.
[mypy-google.cloud.bigtable]
ignore_missing_imports = True

[mypy-google.cloud.bigtable.*]
ignore_missing_imports = True
